name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Baseline supports Linux and macOS. Ubuntu runs every supported Node; macOS runs one, to
    # prove the platform works without tripling the matrix (spec 4).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: pnpm exec playwright install chromium
        if: runner.os != 'Linux'
      - run: pnpm typecheck
      # Before the tests: test/host.spec.ts and test/runner-script.spec.ts rebuild dist/ in their
      # beforeAll, so a --verify after them always passes and proves nothing about the commit.
      - run: node scripts/build.mjs --verify
      - run: pnpm test:coverage
      - name: Plugin tests and validation
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin test && claude plugin validate .
          else
            echo "::warning title=Plugin tests skipped::claude CLI is not installed on this runner, so mod-tests and plugin validate did not run."
          fi
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
